name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#C0392B&color_dots=#EBEDF0,#F4C7C3,#E57368,#C0392B,#7A1F1A
            dist/snake-dark.svg?palette=github-dark&color_snake=#C0392B&color_dots=#161B22,#1B4D57,#7A1F1A,#C0392B,#F4EBD0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
